<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoChain Access - Login</title>
    <!-- Tailwind CSS untuk styling yang rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center min-h-screen m-0">

    <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800 m-4">
        
        <!-- Header InfoChain -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-blue-600 rounded-xl mx-auto flex items-center justify-center text-2xl mb-3 shadow-lg shadow-blue-600/30">⛓</div>
            <h1 class="text-2xl font-bold tracking-tight">InfoChain Access</h1>
            <p class="text-xs text-slate-400 mt-1">Smart Campus & Public Information System</p>
        </div>

        <!-- Form Login / Register -->
        <form id="authForm" onsubmit="handleSubmit(event)" class="space-y-4">
            
            <!-- Nama (Hanya muncul saat mode Register) -->
            <div id="nameFieldContainer" class="hidden">
                <label class="text-xs text-slate-400 block mb-1 font-semibold">Display Name (Min. 3 karakter)</label>
                <input 
                    id="nameInput" 
                    type="text" 
                    placeholder="Nama Lengkap" 
                    minlength="3"
                    class="w-full p-3 rounded-xl border border-slate-700 bg-slate-950 text-white text-sm focus:outline-none focus:border-blue-500"
                />
            </div>

            <!-- Email -->
            <div class="field">
                <label class="text-xs text-slate-400 block mb-1 font-semibold">Email Address</label>
                <input 
                    id="emailInput" 
                    type="email" 
                    placeholder="nama@domain.com" 
                    required 
                    class="w-full p-3 rounded-xl border border-slate-700 bg-slate-950 text-white text-sm focus:outline-none focus:border-blue-500"
                />
            </div>

            <!-- Password dengan Tombol Show/Hide -->
            <div class="field">
                <label class="text-xs text-slate-400 block mb-1 font-semibold">Password (Min. 6 karakter)</label>
                <div class="relative">
                    <input 
                        id="passwordInput" 
                        type="password" 
                        placeholder="••••••••" 
                        required 
                        minlength="6"
                        class="w-full p-3 pr-16 rounded-xl border border-slate-700 bg-slate-950 text-white text-sm focus:outline-none focus:border-blue-500"
                    />
                    <button 
                        type="button" 
                        onclick="togglePassword()" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-blue-400 hover:text-blue-300 bg-slate-800 px-2 py-1 rounded-md"
                    >
                        Show
                    </button>
                </div>
            </div>

            <!-- Tombol Submit -->
            <button 
                id="submitBtn" 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl font-bold text-sm transition shadow-lg shadow-blue-600/30 mt-2"
            >
                Masuk (Login)
            </button>
        </form>

        <!-- Tautan Ganti Mode Login / Register -->
        <div class="text-center mt-6">
            <button 
                type="button" 
                onclick="switchMode()" 
                class="text-xs text-blue-400 hover:underline font-medium"
            >
                Belum punya akun? Daftar sekarang
            </button>
        </div>
    </div>

    <script>
        let isRegistering = false;
        let showPassword = false;

        // Fungsi Ganti Mode antara Login dan Register
        function switchMode() {
            isRegistering = !isRegistering;
            const title = document.querySelector("h1");
            const btn = document.getElementById("submitBtn");
            const switchLink = document.querySelector("button[onclick='switchMode()']");
            const nameContainer = document.getElementById("nameFieldContainer");
            const nameInput = document.getElementById("nameInput");

            if (isRegistering) {
                title.textContent = "InfoChain Register";
                btn.textContent = "Daftar Akun Baru";
                switchLink.textContent = "Sudah punya akun? Login di sini";
                nameContainer.classList.remove("hidden");
                nameInput.setAttribute("required", "true");
            } else {
                title.textContent = "InfoChain Access";
                btn.textContent = "Masuk (Login)";
                switchLink.textContent = "Belum punya akun? Daftar sekarang";
                nameContainer.classList.add("hidden");
                nameInput.removeAttribute("required");
            }
        }

        // Fungsi Tombol Show/Hide Password
        function togglePassword() {
            showPassword = !showPassword;
            const passInput = document.getElementById("passwordInput");
            const toggleBtn = passInput.nextElementSibling;

            if (showPassword) {
                passInput.type = "text";
                toggleBtn.textContent = "Hide";
            } else {
                passInput.type = "password";
                toggleBtn.textContent = "Show";
            }
        }

        // Fungsi Validasi & Proses Submit
        function handleSubmit(e) {
            e.preventDefault();
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value;

            // Ambil daftar user tersimpan dari LocalStorage
            let users = JSON.parse(localStorage.getItem("ic_users_db") || "[]");

            if (isRegistering) {
                const name = document.getElementById("nameInput").value.trim();

                // Validasi Ketat Sesuai Permintaan
                if (name.length < 3) {
                    alert("Display Name minimal harus 3 karakter!");
                    return;
                }
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    alert("Format Email tidak valid! Contoh: nama@domain.com");
                    return;
                }
                if (password.length < 6) {
                    alert("Password terlalu pendek! Minimal harus 6 karakter.");
                    return;
                }

                // Cek apakah email sudah terdaftar
                if (users.some(u => u.email === email)) {
                    alert("Email sudah terdaftar! Silakan login.");
                    return;
                }

                // Simpan user baru
                users.push({ name, email, password });
                localStorage.setItem("ic_users_db", JSON.stringify(users));
                
                // Set sesi user aktif
                localStorage.setItem("ic_current_user", JSON.stringify({ name, email }));
                alert("Registrasi berhasil! Mengarahkan ke aplikasi...");
                window.location.href = "index.html"; // Masuk ke halaman aslimu

            } else {
                // Proses Login
                const found = users.find(u => u.email === email && u.password === password);
                if (found) {
                    localStorage.setItem("ic_current_user", JSON.stringify({ name: found.name, email: found.email }));
                    alert("Login berhasil!");
                    window.location.href = "index.html"; // Masuk ke halaman aslimu
                } else {
                    alert("Email atau Password salah, atau akun belum terdaftar.");
                }
            }
        }
    </script>
</body>
</html>
